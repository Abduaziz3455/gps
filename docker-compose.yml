services:
  app:
    build: .
    container_name: tbb-dispatcher   # one instance only: two would poll GoGPS and the NVR twice
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8090}:8090"   # only nginx on this machine talks to it
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8090
      - TZ=Asia/Tashkent
      - READER_URL=${READER_URL-http://plate-reader:8091}   # set READER_URL= (empty) in .env to switch our reader off
    volumes:
      - ./data:/app/data             # dispatcher.db + photos/ (owned by uid 1000: sudo chown -R 1000:1000 data)
    dns:                             # this machine's own resolver (Tailscale) takes 560 ms an answer, these 60 ms
      - 1.1.1.1
      - 8.8.8.8
    mem_limit: 512m                  # includes up to 2 ffmpeg reading top views: 167 MB together (measured 5 Nov 2026)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Our own plate reader (reader/, docs/plate-recognition-plan.md): re-reads plates the cameras couldn't read, and
  # reads the plate cameras' live video, so the gate keeps working when the cameras' own reading or the NVR fails.
  plate-reader:
    build: ./reader
    container_name: tbb-plate-reader
    restart: unless-stopped
    environment:                     # only what it needs: the NVR address for the live video, no other secrets
      - NVR_HOST=${NVR_HOST}
      - NVR_USER=${NVR_USER:-admin}
      - NVR_PASSWORD=${NVR_PASSWORD}
      - NVR_RTSP_PORT=${NVR_RTSP_PORT:-554}
      - READER_CHANNELS=${READER_CHANNELS:-3,4}   # the plate cameras
      - READER_THREADS=2
      - TZ=Asia/Tashkent
    volumes:
      - ${READER_MODELS_DIR:-/root/gps-models}:/models:ro
    expose:
      - "8091"                       # only the app reaches it, on the compose network
    dns:
      - 1.1.1.1
      - 8.8.8.8
    cpus: 2.5                        # one read at a time on 2 threads (350 ms a picture; 1 thread: 570 ms), plus decoding
                                     # the cameras' video. Idle it uses about 8% of one core
    mem_limit: 1536m                 # measured on production 7 Nov 2026: models 460 MB, a sub-stream decoder 72 MB per
                                     # camera, a full-resolution one 205 MB while a vehicle passes: both gates busy at once
                                     # is about 1 GB. Usual use is about 600 MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
