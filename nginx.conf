server {
    listen 80;
    listen [::]:80;
    server_name tbb-gps.uz www.tbb-gps.uz;

    # Let's Encrypt renewal (webroot): must stay reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://tbb-gps.uz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tbb-gps.uz;

    ssl_certificate     /etc/letsencrypt/live/tbb-gps.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tbb-gps.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://tbb-gps.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tbb-gps.uz;

    ssl_certificate     /etc/letsencrypt/live/tbb-gps.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tbb-gps.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Set here, not in a location: a proxy_set_header inside a location would drop all of the above there.
    proxy_set_header Connection "";

    # Live stream (Server-Sent Events): no buffering, long-lived connection.
    location = /api/stream {
        proxy_pass http://127.0.0.1:8090;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        # GoGPS reports for a vehicle's day can take a while
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8090/health;
        access_log off;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }
}
